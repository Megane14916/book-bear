name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: book_bear_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d book_bear_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Verify manual OIDC CLI configuration without external requests
        run: |
          pnpm --filter api auth:google config
          pnpm --filter api auth:google check
        env:
          SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci_placeholder'
          GOOGLE_OIDC_CLIENT_ID: '123-ci-placeholder.apps.googleusercontent.com'
          API_BASE_URL: 'http://127.0.0.1:8787'
      - run: pnpm --filter api db:check
      - run: pnpm --filter api db:generate
      - name: Verify migration generation is up to date
        run: test -z "$(git status --porcelain -- apps/api/drizzle)"
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/book_bear_test
      - run: pnpm check:openapi
      - run: pnpm build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify environment-based remote configuration without deployment
        run: pnpm --filter api deploy:worker --dry-run
        env:
          HYPERDRIVE_ID: '1234567890abcdef1234567890abcdef'
          SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          CORS_ORIGIN: 'https://web.example.com'
          WRANGLER_SEND_METRICS: 'false'
