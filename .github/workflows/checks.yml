name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: book_bear_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d book_bear_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter api db:check
      - run: pnpm --filter api db:generate
      - name: Verify migration generation is up to date
        run: test -z "$(git status --porcelain -- apps/api/drizzle)"
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/book_bear_test
      - run: pnpm check:openapi
      - run: pnpm build
        env:
          WRANGLER_SEND_METRICS: 'false'
